<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forkcast · free food radar for SF</title>
<meta name="description" content="Live map of SF events with free food. Pizza, boba, coffee and more, updated every few hours.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍕</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="map" aria-label="Map of food events in San Francisco"></div>
<div class="vignette" aria-hidden="true"></div>
<div class="blobs" aria-hidden="true"><i></i><i></i><i></i></div>

<header class="chrome top">
  <div class="logo glass" id="logo" title="Forkcast — free food radar">
    <span class="logo-mark">🍴</span>
    <span class="logo-word">Forkcast</span>
    <span class="logo-count" id="count">–</span>
  </div>
  <nav class="days glass" id="days" aria-label="When">
    <button class="day is-on" data-day="today">Today</button>
    <button class="day" data-day="tomorrow">Tmrw</button>
    <button class="day" data-day="week">Week</button>
    <span class="day-thumb" aria-hidden="true"></span>
  </nav>
</header>

<div class="chrome bottom">
  <div class="chips" id="chips" aria-label="Food type"></div>
  <div class="rail-wrap">
    <div class="rail" id="rail" tabindex="0" aria-label="Food events"></div>
    <div class="empty glass" id="empty" hidden>
      <span class="empty-emoji">🫙</span>
      <span>nothing here yet</span>
    </div>
  </div>
  <div class="stamp" id="stamp"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
